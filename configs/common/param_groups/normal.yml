# Point a training config at this file with:
#   optimizer_args:
#     param_groups: configs/common/param_groups/normal.yml
- name: no_weight_decay
  module_matches:
    - class_name: RMSNorm
      parameter_names:
        - weight
    - class_name: LayerNorm
      parameter_names:
        - weight
    - class_name: PNorm
      parameter_names:
        - weight
    - class_name: RNN
      parameter_names:
        - state_weight
    - class_name: GRU
      parameter_names:
        - state_weight
    - class_name: M2RNN
      parameter_names:
        - state_weight
        - D
    - class_name: Mamba2
      parameter_names:
        - D
    - class_name: SoftplusDecayGate
      parameter_names:
        - A_log
        - dt_bias
  patterns:
    - "*.bias"
  params_group_kwargs:
    weight_decay: 0

- name: normal
  patterns:
    - "*"
