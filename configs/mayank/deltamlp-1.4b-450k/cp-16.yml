training_parameters:
  num_training_steps: 50000
  eval_interval: 50000
  micro_batch_size: 1
  gradient_accumulation_steps: 1
  eval_during_training: true
  gradient_clipping: null

optimizer_args:
  params_group_method: hyperball
  class_name: MuonHSplit
  class_args:
    lr: 0.0045
    weight_decay: 0.1
    betas:
      - 0.9
      - 0.95
    eps: 1e-10
    hybrid_ns: true
    targets: ["attention"]
    mode: 'full'
    patterns:
      attention: "(K B H) D -> (K B) H D"

lr_scheduler_args:
  lr_decay_style: cosine
  num_warmup_steps: 5000
  num_constant_steps: 0
  num_decay_steps: 45000

mixed_precision_args:
  dtype: bf16

distributed_args:
  stage: 3
  torch_compile: true
  zero_topology:
    data_parallel_replication_world_size: 32
    data_parallel_sharding_world_size: 8
  context_parallel_world_size: 16
  gradient_checkpointing_method: block
  gradient_checkpointing_args:
    num_blocks: 14
    use_reentrant: true

# 110 B/day
