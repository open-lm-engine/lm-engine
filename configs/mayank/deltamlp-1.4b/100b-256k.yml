logging_args:
  log_interval: 10
  experiments_tracker_name: wandb
  wandb_args:
    project: mayank-experiments
    name: deltamlp-1.4b-256k-100b

training_parameters:
  num_training_steps: 12500
  eval_interval: 1250
  micro_batch_size: 1
  global_batch_size: 32
  eval_during_training: true
  gradient_clipping: null

optimizer_args:
  params_group_method: hyperball
  class_name: MuonHSplit
  class_args:
    # 0.210 * B^0.54 * D^(-0.38) * N^(-0.103)
    lr: 0.01290277222
    weight_decay: 0.1
    betas:
      - 0.9
      - 0.95
    eps: 1e-10
    hybrid_ns: true
    targets: ["attention"]
    mode: 'full'
    patterns:
      attention: "(K B H) D -> (K B) H D"

lr_scheduler_args:
  lr_decay_style: cosine
  num_warmup_steps: 1250
  num_constant_steps: 0
  num_decay_steps: 11250

mixed_precision_args:
  dtype: bf16

distributed_args:
  stage: 3
  torch_compile: true
  zero_topology:
    data_parallel_replication_world_size: 32
    data_parallel_sharding_world_size: 4
  context_parallel_world_size: 8
  gradient_checkpointing_method: block
  gradient_checkpointing_args:
    num_blocks: 16
    use_reentrant: true
