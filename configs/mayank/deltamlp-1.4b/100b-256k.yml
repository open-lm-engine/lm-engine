datasets:
  # class_name - data_name & data_sampling_ratio are not used but need to be passed to avoid errors
  - class_name: MegatronDataset
    data_name: Megatron
    data_sampling_ratio: 1
    class_args:
      eval_steps: 2
      num_workers: 16
      data_cache_path: data-cache
      node_uses_local_storage: false
      data_path:
        - 200
        - /workspace/data/longmino/shard_00000
        - 126
        - /workspace/data/longmino/shard_00001
      split: 99.5,0.5,0
      # split: 1,0,0
      sequence_length: 262144

tokenizer_args:
  tokenizer_name: allenai/OLMo-3-1025-7B

kernel_args:
  kernels:
    - rnn
    - gru
    - flash_attention_3
    - causal_conv1d

