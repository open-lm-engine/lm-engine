tuning_args:
  tuning_method: pretraining

save_args:
  save_path: /workspace/main/lm_engine/checkpoints
  save_interval: 10000

# load_args:
#   load_path: /workspace/main/lm_engine/checkpoints

logging_args:
  log_interval: 10
  experiments_tracker_name: wandb
  wandb_args:
    project: delta-mlp
    name: transformer-swa-64k

training_parameters:
  num_training_steps: 50000
  eval_interval: 5000
  micro_batch_size: 1
  gradient_accumulation_steps: 1
  eval_during_training: true

optimizer_args:
  class_name: TorchAdamW
  class_args:
    lr: 9e-4
    weight_decay: 0.1
    betas:
      - 0.9
      - 0.95
    eps: 1e-10

lr_scheduler_args:
  lr_decay_style: cosine
  num_warmup_steps: 5000
  num_constant_steps: 0
  num_decay_steps: 45000

mixed_precision_args:
  dtype: bf16

distributed_args:
  stage: 3
  torch_compile: true
  zero_topology:
    data_parallel_replication_world_size: 4
    data_parallel_sharding_world_size: 8
  gradient_checkpointing_method: block
  gradient_checkpointing_args:
    num_blocks: 12
