datasets:
  # class_name - data_name & data_sampling_ratio are not used but need to be passed to avoid errors
  - class_name: MegatronDataset
    data_name: Megatron
    data_sampling_ratio: 1
    class_args:
      eval_steps: 2
      num_workers: 16
      data_cache_path: /export/local/cache
      node_uses_local_storage: true
      data_path:
        - 1
        - /data/merged_data/dolma_merged_olmo
        - 1
        - /data/merged_data/longmino_merged_olmo
        - 1
        - /data/merged_data/stack_merged_olmo
      split: 99.5,0.5,0
      # split: 1,0,0
      sequence_length: 65536

tokenizer_args:
  tokenizer_name: allenai/OLMo-3-1025-7B

kernel_args:
  kernels:
    - rnn
    - gru
    - flash_attention_3

model_args:
  pretrained_config:
    initializer_range: 0.02
    layer_norm_epsilon: 1e-05
    model_type: gpt_base
    normalization_function: rmsnorm
    position_embedding_type: rope
    hidden_size: 1024
    num_layers: 24
    init_method: fan_in
    use_depth_scaled_init: false
    bos_token_id: 100257  # OLMo-3 uses same as eos
    eos_token_id: 100257
    pad_token_id: 100277
    vocab_size: 100278
    max_position_embeddings: 65536
    sequence_mixer_blocks:
      - sequence_mixer_type: softmax_attention
        num_attention_heads: 16
        num_key_value_heads: 16
        use_qk_norm: true
        attention_gate: false
        exclusive_self_attention: true
        sliding_window: 4096
        add_bias: false
        attention_multiplier_method: "1 / head_dim"
