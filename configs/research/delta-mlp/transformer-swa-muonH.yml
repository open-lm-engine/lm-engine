tuning_args:
  tuning_method: pretraining

save_args:
  save_path: /workspace/main/lm-engine/checkpoints
  save_interval: 10000

# load_args:
#   load_path: /workspace/main/lm-engine/checkpoints

logging_args:
  log_interval: 10
  experiments_tracker_name: wandb
  wandb_args:
    project: delta-mlp
    name: transformer-v2-muon-hyperball-swa-64k-5e-3

training_parameters:
  num_training_steps: 50000
  eval_interval: 50000
  micro_batch_size: 1
  gradient_accumulation_steps: 1
  eval_during_training: true

optimizer_args:
  params_group_method: hyperball
  class_name: MuonHyperball
  class_args:
    lr: 5e-3
    weight_decay: 0.1
    momentum: 0.95
    nesterov: true
    betas:
      - 0.9
      - 0.95
    eps: 1e-8
    hybrid_ns: true

lr_scheduler_args:
  lr_decay_style: cosine
  num_warmup_steps: 5000
  num_constant_steps: 0
  num_decay_steps: 45000

mixed_precision_args:
  dtype: bf16

distributed_args:
  stage: 3
  torch_compile: true
  zero_topology:
    data_parallel_replication_world_size: 1
    data_parallel_sharding_world_size: 8
  gradient_checkpointing_method: block
  gradient_checkpointing_args:
    num_blocks: 12