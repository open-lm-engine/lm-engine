tuning_args:
  tuning_method: pretraining

save_args:
  save_path: /data/checkpoints_jyo/hyperball-test
  save_interval: 10000

logging_args:
  log_interval: 10
  experiments_tracker_name: wandb
  wandb_args:
    project: deltamlp-opt-short
    name: hyperball-test

training_parameters:
  num_training_steps: 8000
  eval_interval: 2000
  micro_batch_size: 8
  gradient_accumulation_steps: 2
  eval_during_training: true

optimizer_args:
  params_group_method: hyperball
  class_name: HyperballAdamW
  class_args:
    lr: 1.3e-2
    weight_decay: 0.1
    betas:
      - 0.9
      - 0.95
    eps: 1e-10

lr_scheduler_args:
  lr_decay_style: cosine
  num_warmup_steps: 800
  num_constant_steps: 0
  num_decay_steps: 7200

mixed_precision_args:
  dtype: bf16

distributed_args:
  stage: 0
  torch_compile: true
