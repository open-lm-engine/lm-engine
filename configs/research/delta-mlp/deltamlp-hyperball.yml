datasets:
  - class_name: MegatronDataset
    data_name: Megatron
    data_sampling_ratio: 1
    class_args:
      eval_steps: 2
      num_workers: 16
      data_cache_path: /data/cache_jyo/
      data_path:
        - /data/dolma_merged/merged_text
      split: 99.5,0.5,0
      sequence_length: 4096

tokenizer_args:
  tokenizer_name: allenai/OLMo-3-1025-7B

kernel_args:
  kernels:
    - rnn
    - gru
    - flash_attention_3

model_args:
  pretrained_config:
    initializer_range: 0.02
    layer_norm_epsilon: 1e-05
    model_type: gpt_base
    normalization_function: rmsnorm
    position_embedding_type: rope
    hidden_size: 768
    num_layers: 12
    m_width: 1
    m_emb: 1
    m_residual: 1
    init_method: mup_fan_in
    embedding_init_method: normal
    use_depth_scaled_init: false
    bos_token_id: 100257
    eos_token_id: 100257
    pad_token_id: 100277
    vocab_size: 100278
    max_position_embeddings: 4096
    sequence_mixer_blocks:
