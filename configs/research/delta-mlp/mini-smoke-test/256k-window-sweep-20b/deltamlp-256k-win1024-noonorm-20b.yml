tuning_args:
  tuning_method: pretraining

save_args:
  save_path: /data/checkpoints_jyo/mini-smoke-test/256k-window-sweep-20b/deltamlp-256k-win1024-noonorm-20b
  save_interval: 8000

logging_args:
  log_interval: 10
  experiments_tracker_name: wandb
  wandb_args:
    project: 256k-window-sweep
    name: deltamlp-256k-win1024-noonorm-20b
    tags:
      - "20b"
      - "deltamlp"
      - "noonorm"

training_parameters:
  num_training_steps: 38147
  eval_interval: 2000
  micro_batch_size: 1
  gradient_accumulation_steps: 1
  eval_during_training: true
  gradient_clipping: null  # disable grad clipping (default is 1.0)

optimizer_args:
  params_group_method: hyperball
  class_name: MuonHSplit
  class_args:
    lr: 1e-2
    weight_decay: 0.1
    betas:
      - 0.9
      - 0.95
    eps: 1e-10
    hybrid_ns: true
    targets: ["attention"]
    mode: 'full'
    split_attention_heads: true

lr_scheduler_args:
  lr_decay_style: cosine
  num_warmup_steps: 3815
  num_constant_steps: 0
  num_decay_steps: 34332

mixed_precision_args:
  dtype: bf16

distributed_args:
  stage: 3
  torch_compile: true
  context_parallel_world_size: 8
  context_parallel_load_balancing_method: null
  zero_topology:
    data_parallel_replication_world_size: 2
    data_parallel_sharding_world_size: 8
