save_args:
  save_path: /data/checkpoints/mayank/test
  save_interval: 10000

# load_args:
#   load_path: /data/checkpoints/mayank/test

logging_args:
  log_interval: 10
  # torch_profiler_trace_path: tmp
  # experiments_tracker_name: wandb
  # wandb_args:
  #   project: delta-mlp
  #   name: test

training_parameters:
  num_training_steps: 50000
  eval_interval: 5000
  gradient_clipping: null
  micro_batch_size: 4
  gradient_accumulation_steps: 4
  eval_during_training: true

optimizer_args:
  params_group_method: hyperball
  class_name: HyperballAdamW
  class_args:
    lr: 9e-3
    weight_decay: 0.1
    betas:
      - 0.9
      - 0.95
    eps: 1e-10

lr_scheduler_args:
  lr_decay_style: cosine
  num_warmup_steps: 5000
  num_constant_steps: 0
  num_decay_steps: 45000

mixed_precision_args:
  dtype: bf16

distributed_args:
  stage: 0
  torch_compile: true
