# Point a training config at this file with:
#   optimizer_args:
#     param_groups: configs/param-groups/mup.yml
- name: no_weight_decay
  module_matches:
    - class_name: RMSNorm
      parameter_names:
        - weight
    - class_name: LayerNorm
      parameter_names:
        - weight
    - class_name: PNorm
      parameter_names:
        - weight
    - class_name: SoftplusDecayGate
      parameter_names:
        - dt_bias
  patterns:
    - "*.bias"
  params_group_kwargs:
    weight_decay: 0

- name: normal
  module_matches:
    - class_name: ParameterizedEmbedding
      parameter_names:
        - weight

# catch-all: every remaining weight (mlp/attention/sequence-mixer projections, state_weight, D, A_log, ...)
# gets the muP learning-rate multiplier
- name: mup
  patterns:
    - "*"
  params_group_kwargs:
    lr_multiplier_method: "1 / m_width"
