# Clusters shown on the dashboard.
#
# Each entry:
#   id        unique short name, also used as ssh_host unless overridden
#   label     display label in the UI
#   kind      one of: tpu, slurm_gpu, amd_gpu, nvidia_gpu
#   ssh_host  host alias from ~/.ssh/config (defaults to id)
#   script    remote collection script to run over SSH (defaults per kind, see below)
#
# Default script per kind:
#   tpu         -> remote_collect_tpu.sh
#   slurm_gpu   -> remote_collect_slurm_gpu.sh
#   amd_gpu     -> remote_collect_amd_gpu.sh
#   nvidia_gpu  -> remote_collect_nvidia_gpu.sh

clusters:
  - id: gcp
    label: gcp — TPU v6e-4
    kind: tpu
  - id: rubin
    label: rubin — Slurm/GPU
    kind: slurm_gpu
  - id: runpod
    label: runpod — Slurm/GPU
    kind: slurm_gpu
  - id: sky-mi350x
    label: sky-mi350x — 8x MI350X
    kind: amd_gpu
  - id: sky-b200
    label: sky-b200 — 8x B200
    kind: nvidia_gpu
  - id: sky-h200
    label: sky-h200 — 8x H200
    kind: nvidia_gpu
